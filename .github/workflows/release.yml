name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Stamp Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/Version: .*/Version: ${VERSION}/" wayforpay-givewp.php
          sed -i "s/define( 'WAYFORPAY_GIVEWP_VERSION', '.*' );/define( 'WAYFORPAY_GIVEWP_VERSION', '${VERSION}' );/" wayforpay-givewp.php

      - name: Sync changelog into readme.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: php scripts/changelog-to-readme.php "${GITHUB_REF_NAME#v}"

      - name: Build plugin zip
        run: composer zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayforpay-givewp
          path: wayforpay-givewp.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wayforpay-givewp.zip
          generate_release_notes: true
