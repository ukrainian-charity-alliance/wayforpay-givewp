name: Deploy to WordPress.org

# Deploys a GitHub Release's zip, as published, to WordPress.org SVN. release.yml
# calls it after each release; run it by hand to re-run a failed deploy. dry_run
# skips the SVN commit.

on:
  workflow_call:
    inputs:
      tag:
        description: Released tag to deploy
        type: string
        required: true
      dry_run:
        description: Run everything except the SVN commit
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to deploy, e.g. 1.3.1
        type: string
        required: true
      dry_run:
        description: Run everything except the SVN commit
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: wporg-deploy
      cancel-in-progress: false
    # Holds SVN_USERNAME and SVN_PASSWORD; only main and release tags may use it.
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/uca-payment-gateway-with-wayforpay-for-givewp/
    permissions:
      contents: read
    env:
      SLUG: uca-payment-gateway-with-wayforpay-for-givewp
      TAG: ${{ inputs.tag }}

    steps:
      # Only for the preflight script and .wordpress-org/; the plugin comes from the zip.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern "$SLUG.zip" --dir build
          unzip -q "build/$SLUG.zip" -d build/wporg

      - name: Preflight
        id: preflight
        run: bash scripts/wporg-preflight.sh "$TAG" build/wporg

      - name: Deploy to SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ steps.preflight.outputs.version }}
          BUILD_DIR: build/wporg
          ASSETS_DIR: .wordpress-org
